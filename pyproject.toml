[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jaya-surabhi-pos"
version = "0.1.0"
description = "Local-first point of sale foundation for Jaya Surabhi Super Market"
requires-python = ">=3.12,<3.15"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "openpyxl>=3.1,<4",
    "python-multipart>=0.0.9,<1",
    "SQLAlchemy>=2.0,<3",
    "tzdata>=2025.2",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
