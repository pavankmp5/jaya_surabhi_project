<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jaya Surabhi | Finance Desk</title>
<style>
:root{font-family:Segoe UI,system-ui,sans-serif;color:#182a28;background:#f3f6f4}*{box-sizing:border-box}body{margin:0}header{background:#123c34;color:white;padding:18px max(20px,calc((100vw - 1100px)/2));display:flex;justify-content:space-between;align-items:center}main{max-width:1100px;margin:24px auto;padding:0 18px}.card{background:white;border:1px solid #dbe5e0;border-radius:12px;padding:18px;margin:14px 0;box-shadow:0 3px 12px #173a3010}h1{font-size:20px;margin:0}h2{font-size:17px;margin:0 0 14px}button{background:#176b54;color:white;border:0;border-radius:7px;padding:9px 13px;cursor:pointer}button.secondary{background:#e6efeb;color:#163d34}button.danger{background:#a33838}input,select{padding:9px;border:1px solid #b9c9c2;border-radius:6px;margin:4px;max-width:100%}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.muted{color:#60736c;font-size:13px}.error{color:#a33838}.tabs{display:flex;gap:8px;flex-wrap:wrap}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:9px;border-bottom:1px solid #e3eae6;vertical-align:top}th{color:#45635a}.scroll{overflow:auto}.hidden{display:none}.pill{background:#e8f2ed;padding:3px 8px;border-radius:99px}
</style></head><body><header><h1>Jaya Surabhi · Finance Desk</h1><span id="who" class="muted" style="color:#d5e8df"></span></header><main>
<section id="login" class="card"><h2>Sign in</h2><div class="row"><input id="username" autocomplete="username" placeholder="Username"><input id="password" type="password" autocomplete="current-password" placeholder="Password"><button id="signIn">Sign in</button></div><p class="muted">Use your POS account. Finance data remains protected by the server role checks.</p></section>
<div id="workspace" class="hidden"><div class="card"><div class="tabs"><button data-view="payments">Payment history</button><button data-view="statement">Customer statement</button><button data-view="receipt">Receipt</button><button id="logout" class="secondary">Sign out</button></div></div>
<section id="payments" class="card view"><div class="row"><h2 style="margin:0 auto 0 0">Recent payments</h2><button id="loadPayments" class="secondary">Refresh</button></div><div id="paymentTable" class="scroll"></div></section>
<section id="statement" class="card view hidden"><h2>Customer statement and reversal review</h2><div class="row"><select id="customers"><option value="">Choose customer</option></select><button id="loadStatement">Open statement</button></div><div id="statementData"></div><div id="adjustment" class="hidden"><h2>Administrator adjustment</h2><div class="row"><select id="direction"><option value="debit">Debit · increase balance</option><option value="credit">Credit · reduce balance</option></select><input id="amount" inputmode="decimal" placeholder="Amount"><input id="reason" placeholder="Reason (at least 8 characters)" style="min-width:280px"><input id="refEntry" placeholder="Reference entry ID (optional)"><button id="saveAdjustment">Record adjustment</button></div></div></section>
<section id="receipt" class="card view hidden"><h2>Receipt presentation</h2><div class="row"><input id="receiptNumber" placeholder="RET/2026-27/000001" style="min-width:260px"><button id="loadReceipt">Show receipt</button></div><div id="receiptData"></div></section></div><p id="message" class="muted"></p></main>
<script>
let token='',role='',selected='',pendingAdjustment=null,pendingReversalActions={};const $=id=>document.getElementById(id);const msg=(s,bad=false)=>{$('message').textContent=s;$('message').className=bad?'error':''};const money=x=>Number(x||0).toFixed(2);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,opts={}){const r=await fetch(path,{...opts,headers:{...(opts.headers||{}),Authorization:'Bearer '+token,...(opts.body?{'Content-Type':'application/json'}:{})}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.detail||'Request failed ('+r.status+')');return d}
$('signIn').onclick=async()=>{try{const d=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('username').value,password:$('password').value})});const j=await d.json();if(!d.ok)throw Error(j.detail||'Sign in failed');token=j.access_token;const me=await api('/auth/me');role=me.role;$('who').textContent=me.username+' · '+role;$('login').classList.add('hidden');$('workspace').classList.remove('hidden');$('adjustment').classList.toggle('hidden',role!=='admin');await customers();await payments();msg('Signed in.');}catch(e){msg(e.message,true)}};
$('logout').onclick=()=>{token='';$('workspace').classList.add('hidden');$('login').classList.remove('hidden');$('who').textContent='';msg('Signed out.')};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.view').forEach(v=>v.classList.add('hidden'));$(b.dataset.view).classList.remove('hidden')});
async function customers(){const cs=await api('/api/customers');$('customers').innerHTML='<option value="">Choose customer</option>'+cs.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}${c.phone?' · '+esc(c.phone):''}</option>`).join('')}
async function payments(){try{const d=await api('/api/payment-history?limit=100');$('paymentTable').innerHTML=`<p class="muted">${d.total} payment records · newest first</p><table><thead><tr><th>Date</th><th>Receipt</th><th>Method</th><th>Amount</th><th>Customer</th><th>Reference</th></tr></thead><tbody>${d.payments.map(p=>`<tr><td>${esc(new Date(p.created_at).toLocaleString())}</td><td>${esc(p.receipt_number)}</td><td>${esc(p.method)}</td><td>${money(p.amount)}</td><td>${esc(p.customer_name||'—')}</td><td>${esc(p.reference||'—')}</td></tr>`).join('')}</tbody></table>`}catch(e){msg(e.message,true)}}$('loadPayments').onclick=payments;
$('loadStatement').onclick=statement;async function statement(){selected=$('customers').value;if(!selected)return msg('Choose a customer first.',true);try{const d=await api(`/api/customers/${selected}/statement?limit=500`);const reversed=new Set(d.entries.map(x=>x.reversal_of_id).filter(Boolean));$('statementData').innerHTML=`<p><b>Outstanding: ${money(d.outstanding_balance)}</b> <span class="muted"> · ${d.total} entries · balance as of now</span></p><div class="scroll"><table><thead><tr><th>Date</th><th>Type</th><th>Direction</th><th>Amount</th><th>Running balance</th><th>Reason / link</th><th>Review</th></tr></thead><tbody>${d.entries.map(e=>`<tr><td>${esc(new Date(e.created_at).toLocaleString())}</td><td>${esc(e.entry_type)}</td><td>${esc(e.direction)}</td><td>${money(e.amount)}</td><td>${money(e.running_balance)}</td><td>${esc(e.reason||'—')}<br><small>${e.reversal_of_id?'Reversal of '+esc(e.reversal_of_id):e.reference_entry_id?'Reference '+esc(e.reference_entry_id):''}</small></td><td>${role==='admin'&&e.entry_type!=='reversal'&&!reversed.has(e.id)?`<button class="danger" onclick="reverseEntry('${esc(e.id)}')">Review / reverse</button>`:reversed.has(e.id)?'<span class="pill">Reversed</span>':''}</td></tr>`).join('')}</tbody></table></div>`}catch(e){msg(e.message,true)}}
window.reverseEntry=async id=>{if(!selected)return msg('Choose a customer first.',true);if(!pendingReversalActions[id]){const reason=prompt('Administrator reason for reversal (minimum 8 characters):');if(reason===null)return;pendingReversalActions[id]={customerId:selected,reason,key:'ui-reversal-'+crypto.randomUUID()}}const pending=pendingReversalActions[id];try{await api(`/api/customers/${pending.customerId}/ledger/${id}/reversals`,{method:'POST',headers:{'Idempotency-Key':pending.key},body:JSON.stringify({reason:pending.reason})});delete pendingReversalActions[id];msg('Compensating entry recorded.');await statement()}catch(e){msg(e.message+' Retry keeps the original request key and reason.',true)}};
$('saveAdjustment').onclick=async()=>{if(!selected)return msg('Choose a customer first.',true);pendingAdjustment??={customerId:selected,key:'ui-adjustment-'+crypto.randomUUID(),body:{direction:$('direction').value,amount:$('amount').value,reason:$('reason').value,reference_entry_id:$('refEntry').value||null}};const pending=pendingAdjustment;try{await api(`/api/customers/${pending.customerId}/adjustments`,{method:'POST',headers:{'Idempotency-Key':pending.key},body:JSON.stringify(pending.body)});pendingAdjustment=null;msg('Adjustment recorded.');$('amount').value='';$('reason').value='';$('refEntry').value='';await statement()}catch(e){msg(e.message+' Retry keeps the original request key and values.',true)}};
$('loadReceipt').onclick=async()=>{try{const p=await api('/api/receipts/'+encodeURIComponent($('receiptNumber').value).replaceAll('%2F','/'));$('receiptData').innerHTML=`<h2>${esc(p.receipt_number)}</h2><p>Status: ${esc(p.payment_status)} · Issued: ${esc(p.issued_at||'')}</p><table><thead><tr><th>Item</th><th>Qty</th><th>Unit price</th><th>Line total</th></tr></thead><tbody>${p.lines.map(l=>`<tr><td>${esc(l.description)}${l.sku?' · '+esc(l.sku):''}</td><td>${esc(l.quantity)} ${esc(l.unit)}</td><td>${money(l.unit_price)}</td><td>${money(l.line_total)}</td></tr>`).join('')}</tbody></table><p><b>Total ${money(p.total)} · Received ${money(p.received_total)} · Khata ${money(p.khata_total)} · Settled ${money(p.settled_total)} · Due ${money(p.balance_due)}</b></p><p>Payments: ${p.payments.map(x=>`${esc(x.method)} ${money(x.amount)}${x.reference?' ('+esc(x.reference)+')':''}`).join(' · ')||'None'}</p>`}catch(e){msg(e.message,true)}};
</script></body></html>
